name: CI

on:
  push:
    branches: [dev/classic-mode]
  pull_request:
    branches: [main, dev/classic-mode]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.20.2
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.5
      - run: npm ci
      - name: Install regression test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Verify integration tooling
        run: |
          bash -n scripts/run_live_match_integration.sh
          bash -n scripts/live_integration_selection.sh
          bash -n scripts/scan_client_credentials.sh
          bash -n scripts/test_client_credential_scan.sh
          deno cache --frozen-lockfile --config supabase/functions/deno.json supabase/tests/integration/live_slice_test.ts
          python3 -B scripts/test_live_integration_selection.py
          deno test --allow-read supabase/tests/integration/scenario_selection_test.ts
          bash scripts/test_client_credential_scan.sh
      - name: Verify invitation landing
        run: node --test invitation-landing/tests/landing.test.mjs
      - name: Verify generated data
        run: |
          python3 scripts/check_word_pack.py --checked-in-only
          python3 -B scripts/test_build_accepted_guesses.py
          npm run check:seed
      - name: Verify shared rules
        run: |
          deno fmt --check rules/typescript
          deno lint rules/typescript
          deno check rules/typescript/evaluator.ts rules/typescript/evaluator_test.ts
          deno test --allow-read rules/typescript/evaluator_test.ts
      - name: Verify Edge Functions
        run: |
          deno fmt --check supabase/functions
          deno lint supabase/functions
          deno check --config supabase/functions/deno.json \
            supabase/functions/_shared/command.ts \
            supabase/functions/_shared/command_test.ts \
            supabase/functions/_shared/live_protocol_test.ts \
            supabase/functions/create-match/index.ts \
            supabase/functions/create-match/index_test.ts \
            supabase/functions/join-match/index.ts \
            supabase/functions/join-match/index_test.ts \
            supabase/functions/rematch-command/index.ts \
            supabase/functions/rematch-command/index_test.ts \
            supabase/functions/start-match/index.ts \
            supabase/functions/start-match/index_test.ts \
            supabase/functions/submit-guess/index.ts \
            supabase/functions/submit-guess/index_test.ts \
            supabase/functions/match-snapshot/index.ts \
            supabase/functions/match-snapshot/index_test.ts \
            supabase/functions/delete-account/index.ts \
            supabase/functions/delete-account/index_test.ts
          deno test --config supabase/functions/deno.json supabase/functions/
      - name: Verify database
        run: |
          npx --no-install supabase start
          npx --no-install supabase db reset
          npx --no-install supabase test db
          npx --no-install supabase db lint --local --schema public,private,app_rls --level warning --fail-on error

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Test
        run: >-
          xcodebuild -project ios/GridRace.xcodeproj -scheme GridRace
          -disableAutomaticPackageResolution
          -onlyUsePackageVersionsFromResolvedFile
          -skipPackageUpdates
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'
          -derivedDataPath "$RUNNER_TEMP/GridRaceDerivedData-test" test
      - name: Clean build
        run: >-
          xcodebuild -project ios/GridRace.xcodeproj -scheme GridRace -configuration Debug
          -disableAutomaticPackageResolution
          -onlyUsePackageVersionsFromResolvedFile
          -skipPackageUpdates
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'
          -derivedDataPath "$RUNNER_TEMP/GridRaceDerivedData-build" clean build
