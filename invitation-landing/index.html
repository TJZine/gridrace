<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none'; img-src 'none'">
  <title>GridRace invitation</title>
  <link rel="stylesheet" href="/landing.css">
  <script type="module" src="/landing.mjs"></script>
</head>
<body>
<main>
  <p class="wordmark">GRIDRACE</p>
  <p class="subject">LIVE RACE · INVITATION</p>
  <h1>Race a friend.</h1>
  <p id="room-code" class="seal" aria-label="Room code" hidden></p>
  <p id="status">Open this invitation in GridRace. If the app isn't installed, install it and reopen the link, or ask your friend for the room code.</p>
  <nav aria-label="Invitation actions">
    <a id="install" hidden rel="noreferrer">Install GridRace</a>
    <a id="reopen" hidden rel="noreferrer">Reopen invitation</a>
  </nav>
  <noscript>Ask your friend for the room code. Install GridRace, then reopen the invitation or enter the code in Live race.</noscript>
</main>
</body>
</html>
